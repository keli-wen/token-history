<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="AI coding usage — last 30 days">
<style>
svg{--f:Poppins,Arial,"Helvetica Neue",sans-serif;--fs:Lora,Georgia,"Iowan Old Style",serif;--fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--surface:#faf9f5; --primary:#141413; --secondary:#53524b; --muted:#8a887f; --grid:#e8e6dc; --axis:#cbc8bc; --claude:#d06a41; --codex:#4382c9; --ramp0:#edeae0; --ramp1:#f2cdb9; --ramp2:#e59a70; --ramp3:#d06a41; --ramp4:#9c4a26; --ink3:#141413; --ink4:#ffffff;}
@media (prefers-color-scheme: dark){svg{--surface:#141413; --primary:#faf9f5; --secondary:#b0aea5; --muted:#85837a; --grid:#292824; --axis:#383630; --claude:#db7448; --codex:#5b95d6; --ramp0:#232221; --ramp1:#4b2b1b; --ramp2:#8a4526; --ramp3:#cf6a3e; --ramp4:#f0a37a; --ink3:#141413; --ink4:#141413;}}
.bg{fill:var(--surface)}
.grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.t{font-family:var(--f);fill:var(--primary)}
.t2{font-family:var(--f);fill:var(--secondary)}
.tm{font-family:var(--f);fill:var(--muted);font-variant-numeric:tabular-nums}
.ts{font-family:var(--fs);fill:var(--primary)}
.tn{font-family:var(--fm);fill:var(--primary);font-variant-numeric:tabular-nums}
.s-claude{fill:var(--claude)}.s-codex{fill:var(--codex)}
.r0{fill:var(--ramp0)}.r1{fill:var(--ramp1)}.r2{fill:var(--ramp2)}.r3{fill:var(--ramp3)}.r4{fill:var(--ramp4)}
.on3{fill:var(--ink3)}.on4{fill:var(--ink4)}
.wip{opacity:.5}
.b{animation:lift .7s cubic-bezier(.2,.7,.3,1) both}@keyframes lift{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
